{% extends "base.html" %}

{% block title %}Edit Transaction - Expense Manager{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <h2 class="mb-4">
                Edit Transaction
            </h2>

            <form method="POST">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <!-- Transaction Type -->
                <div class="mb-3">

                    <label
                        for="transaction_type"
                        class="form-label"
                    >
                        Type
                    </label>

                    <select
                        class="form-select"
                        id="transaction_type"
                        name="transaction_type"
                        required
                    >

                        <option
                            value="income"
                            {% if transaction.transaction_type == "income" %}
                                selected
                            {% endif %}
                        >
                            Income
                        </option>

                        <option
                            value="expense"
                            {% if transaction.transaction_type == "expense" %}
                                selected
                            {% endif %}
                        >
                            Expense
                        </option>

                    </select>

                </div>


                <!-- Amount -->
                <div class="mb-3">

                    <label
                        for="amount"
                        class="form-label"
                    >
                        Amount
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.01"
                        value="{{ transaction.amount }}"
                        required
                    >

                </div>


                <!-- Category -->
                <div class="mb-3">

                    <label
                        for="category_id"
                        class="form-label"
                    >
                        Category
                    </label>

                    <select
                        class="form-select"
                        id="category_id"
                        name="category_id"
                        required
                    >

                        <option
                            value=""
                            disabled
                        >
                            Select category
                        </option>

                        {% for category in categories %}

                            <option
                                value="{{ category.id }}"
                                {% if transaction.category_id == category.id %}
                                    selected
                                {% endif %}
                            >
                                {{ category.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Description -->
                <div class="mb-3">

                    <label
                        for="description"
                        class="form-label"
                    >
                        Description
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="description"
                        name="description"
                        value="{{ transaction.description or '' }}"
                    >

                </div>


                <!-- Date -->
                <div class="mb-3">

                    <label
                        for="transaction_date"
                        class="form-label"
                    >
                        Date
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="transaction_date"
                        name="transaction_date"
                        value="{{ transaction.transaction_date.strftime('%Y-%m-%d') }}"
                        required
                    >

                </div>


                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{{ url_for('transactions.transactions') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
